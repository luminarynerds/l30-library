[pytest]
# Pytest configuration for 405 error prevention tests
#
# Usage:
#   pytest -c pytest_405.ini
#   pytest -c pytest_405.ini -v
#   pytest -c pytest_405.ini -k "test_endpoint"
#

asyncio_mode = auto
testpaths = tests app/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test discovery
python_classes = Test*
python_functions = test_*

# Markers
markers =
    unit: Unit tests
    integration: Integration tests
    slow: Slow running tests
    endpoint_methods: Tests for endpoint HTTP method support
    405_prevention: Tests to prevent HTTP 405 errors
    consistency: Tests for endpoint consistency rules

# Reporting
addopts =
    --strict-markers
    --tb=short
    --capture=no
    -ra
    --maxfail=5

# Performance
timeout = 300
timeout_method = thread

# Verbose output
console_output_style = progress
log_cli = false
log_cli_level = INFO

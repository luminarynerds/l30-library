[project]
name = "l30-library"
version = "0.1.0"
description = "L30 Library"
requires-python = ">=3.11"
# Security floors are maintained with the dependency review in
# docs/dependency-security-2026-10-25.md.
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "gunicorn>=21.0.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "PyJWT>=2.15.0",
    "bcrypt>=4.0.1",
    "python-multipart>=0.0.31",  # Security: Fix CVE-2026-24486, DoS via large multipart preamble
    "pydantic[email]>=2.5.3",
    "pydantic-settings>=2.14.2",
    "redis>=5.0.1",
    "httpx>=0.26.0",
    "certifi>=2026.10.19",  # Security floor for the HTTP clients' CA bundle
    "aiohttp>=3.14.3",
    # email-validator removed: transitive dep of pydantic[email], not imported directly
    "slowapi>=0.1.9",
    "rapidfuzz>=3.0.0",
    "pymarc>=5.0.0",
    "reportlab>=4.0.0",
    "openpyxl>=3.1.0",
    "jinja2>=3.1.6",
    "sentry-sdk>=1.40.0",
    "python-json-logger>=2.0.7",
    "cryptography>=50.0.0",  # Security: 3 advisories fixed in 50.0.0 (pip-audit, 2026-09)
    # urllib3 removed: transitive dep of httpx/other packages, never imported directly
    # requests removed: not imported in app code; httpx is the HTTP client used throughout
    "apscheduler>=3.10.0",
    "psycopg2-binary>=2.9.9",
    "aiofiles>=23.0.0",
    "pgvector>=0.4.0",
    "numpy>=1.21.0",
    "paramiko>=3.4.0",
    "python-pptx>=0.6.21",
    "pillow>=13.0.0",  # Security: image-decoder and Ghostscript fixes (2026-10)
    "pypdf>=6.21.4",  # Security: 7 GHSA advisories (xref/stream parsing loops) fixed by 6.21.4 (2026-11)
    "pikepdf>=10.0.0",  # PDF accessibility tagging (structure tags, MarkInfo, StructTreeRoot)
    # OpenTelemetry moved to [project.optional-dependencies] tracing group (25MB+ with grpc)
    # Install with: pip install ".[tracing]" when collector is configured
    "pyotp>=2.9.0",
    "qrcode>=7.4",
    # stripe removed: 0 imports in app code (23MB). Re-add when Stripe Connect is integrated.
    "python-dateutil>=2.8.0",
    "alembic>=1.13.0",
    "mako>=1.3.12",
    "python-docx>=1.2.0",
    "packaging>=24.0",
    "nh3>=0.2.17",  # Server-side HTML sanitization for blog rich-text fields (defense in depth alongside frontend DOMPurify)
    "pyzipper>=0.3.6",  # AES-encrypted ZIP for data-export bundles
]

[project.optional-dependencies]
documents = [
    "pymupdf>=1.24.0",  # PDF text extraction for document ingestion (newsletters, reports)
]
security = [
    "clamd>=1.0.2",  # ClamAV daemon client for virus scanning
]
tracing = [
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-exporter-otlp>=1.20.0",
]
linkeddata = [
    "rdflib>=7.0.0",  # Full RDF processing (optional, built-in JSON-LD/Turtle provided)
]
rerank = [
    # Catalog cross-encoder reranker. Heavy (~250MB wheels + ~600MB model
    # weights baked into the image) so it lives in an opt-in extra rather
    # than the base install. The prod image installs ``.[rerank]`` so the
    # backend gets the encoder; dev environments can skip it unless they
    # are actively exercising relevance work.
    # NOTE: install via the CPU PyTorch index to avoid pulling 2GB of CUDA:
    #   pip install --extra-index-url https://download.pytorch.org/whl/cpu \
    #       ".[rerank]"
    "torch>=2.2.0",
    "sentence-transformers>=5.6.0,<6",
]

[build-system]
requires = [
    "hatchling",
    "pip>=26.0",        # Security: Fix CVE-2025-8869, CVE-2026-1703 (path traversal vulnerabilities)
    "setuptools>=78.1.1",  # Security: Fix PYSEC-2025-49, CVE-2024-6345 (RCE via package URLs)
    "wheel>=0.46.2",    # Security: Fix CVE-2026-24049 (arbitrary file permission modification)
]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests", "tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "--strict-markers --ignore=app/core/test_utils.py --ignore=tests/quarantine"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "slow: Slow running tests",
    "performance: Performance benchmark tests",
    "property: Property-based tests using Hypothesis",
    "smoke: Smoke tests (broad shallow happy-path across major flows)",
    "analysis: Static/structural guardrails (e.g. repo-shape assertions, not runtime behavior)",
    "security: Adversarial/attack-simulation tests (auth, sessions, rate limiting)",
]

[tool.coverage.run]
source = ["app"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23.3",
    "pytest-cov>=4.1.0",
    "aiosqlite>=0.19.0",
    "jsonschema>=4.20.0",
    "faker>=22.0.0",
    "hypothesis>=6.100",  # tests/property/
    "libcst>=1.1.0",  # AST refactor scripts (scripts/destyle/)
    "ruff>=0.6.0",
    "mypy>=1.10",
]

# ============================================================================
# TWO-TIER COVERAGE MODEL
# ============================================================================
#
# GLOBAL THRESHOLD: 85%
# Enforced via --cov-fail-under=85 in [tool.pytest.ini_options]
#
# CRITICAL DOMAIN THRESHOLDS: 90-95%
# These modules require higher coverage due to security and financial impact.
# Enforcement: Run `pytest --cov-report=term-missing` and manually verify
# critical module coverage meets thresholds below.
#
# To check individual module coverage:
#   pytest --cov=app --cov-report=term-missing | grep -E "auth|security|privacy|fine|stripe|payment"
#
# CRITICAL DOMAINS:
#
# 1. Authentication & Authorization (95% minimum):
#    - app/api/v1/auth.py
#    - app/core/security.py
#    - app/core/authorization.py
#
# 2. Privacy & Data Protection (95% minimum):
#    - app/api/v1/privacy.py
#    - app/services/privacy_audit.py
#
# 3. Financial & Payment Workflows (90% minimum):
#    - Fine Management:
#      - app/services/fine_service.py
#      - app/services/fine_reversal_service.py
#      - app/services/fine_jobs.py
#      - app/services/fine_policy_service.py
#
#    - Payment Processing:
#      - app/services/stripe_connect_service.py
#      - app/services/financial_reports_service.py
#      - app/services/payout_notification_service.py
#      - app/services/payout_scheduler_service.py
#
#    - Tax & Compliance:
#      - app/services/tax_compliance_service.py
#      - app/services/tax_reporting_service.py
#
#    - Consortium Billing:
#      - app/services/consortium_billing_service.py
#      - app/services/consortium_billing_scheduler.py
#      - app/services/consortium_invoice_export_service.py
#
# 4. Patron Account Security (90% minimum):
#    - app/services/suspension_service.py
#    - app/services/patron_recovery_service.py
#
# ============================================================================
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations", "*.ipynb"]

[tool.ruff.lint]
# Sweep B rules are added incrementally. Each PR enables one rule.
select = ["PIE790", "B904", "BLE001", "SIM105", "TRY203", "TRY302"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = []

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["migrations", "tests/quarantine"]
# Deliberately loose (no --strict, no disallow-untyped-defs) — this is a
# regression gate on a ratcheted baseline, not a type-safety mandate. Tighten
# only after the baseline is drained.

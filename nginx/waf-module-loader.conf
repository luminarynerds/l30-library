# =============================================================================
# L30 WAF - Module Loader & Enforcement Logic
# =============================================================================
# This file loads all WAF detection maps and enforces blocking behavior.
# Include this in the main http block of nginx.conf
#
# WAF Modes:
#   - off     : No WAF rules applied (production fallback if WAF causes issues)
#   - detect  : Log suspicious requests, do not block (default, safe for rollout)
#   - enforce : Log and block suspicious requests (402 rate limit / 403 forbidden)
# =============================================================================

# Default WAF mode: "detect" (log-only)
# To enable enforcement, pass WAF_MODE=enforce in docker-compose environment
map $waf_mode_env $waf_mode {
    default "detect";
    "~^enforce$" "enforce";
    "~^off$" "off";
}

# =============================================================================
# THRESHOLD CONFIGURATION
# =============================================================================

# Minimum risk score to trigger blocking (when WAF_MODE=enforce)
# Each detection adds points:
#   - SQLi: 3 points
#   - XSS: 3 points
#   - Path Traversal: 2 points
#   - Command Injection: 3 points
#   - LFI: 2 points
#   - Scanner: 1 point
#   - Suspicious UA: 1 point
#   - Protocol Attack: 2 points
# Default threshold: 5 (must trigger 2+ rules or 1 high-severity rule)

map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt$scanner_signature$suspicious_ua$protocol_attack $risk_score {
    default 0;
    "1" 3;      # SQLi only
    "01" 3;     # XSS only
    "001" 2;    # Path traversal only
    "0001" 3;   # Command injection only
    "00001" 2;  # LFI only
    "000001" 1; # Scanner signature only
    "0000001" 1; # Bad UA only
    "00000001" 2; # Protocol attack only
}

# Calculate total risk score from all detections
map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt $risk_combine {
    default 0;
    "11" 6;
    "101" 5;
    "110" 5;
    "111" 9;
    "1001" 5;
}

# =============================================================================
# REQUEST CLASSIFICATION
# =============================================================================

# Determine if this is a suspicious request that should be logged
map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt$scanner_signature$suspicious_ua$protocol_attack $is_suspicious {
    "00000000" 0;
    default 1;
}

# Determine action: pass (0), log (1), or block (2)
map $waf_mode$is_suspicious $waf_action_code {
    "off0" 0;      # WAF off, not suspicious
    "off1" 0;      # WAF off, even if suspicious
    "detect0" 0;   # Detect mode, not suspicious
    "detect1" 1;   # Detect mode, suspicious - log only
    "enforce0" 0;  # Enforce mode, not suspicious
    "enforce1" 2;  # Enforce mode, suspicious - block
}

# Human-readable action for logging
map $waf_action_code $action_desc {
    0 "allow";
    1 "detect";
    2 "block";
}

# =============================================================================
# THREAT CLASSIFICATION
# =============================================================================

# Identify the primary threat type for better logging
map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt $threat_type {
    default "unknown";
    "1" "sql_injection";
    "01" "xss";
    "001" "path_traversal";
    "0001" "command_injection";
    "00001" "lfi";
}

# =============================================================================
# RATE LIMITING - PER-IP THREAT SCORING
# =============================================================================

# Track threat attempts per IP address using limit_req_zone
# Each suspicious request increments the IP's score
limit_req_zone $remote_addr zone=waf_ip_rate:10m rate=10r/s;
limit_req_zone $remote_addr zone=waf_threats:10m rate=5r/s;

# =============================================================================
# RESPONSE SELECTION BASED on ACTION
# =============================================================================

# Status code to return
map $waf_action_code $response_status {
    0 200;    # Allow (will be set by actual response handler)
    1 200;    # Detect (log and allow)
    2 429;    # Block - rate limit (Too Many Requests)
}

# Response body for blocked requests
map $waf_action_code $response_body {
    0 "";
    1 "";
    2 "Request blocked by WAF. Threat detected: $threat_type";
}

# =============================================================================
# DETAILED WAF LOGGING
# =============================================================================

# Extended log format for forensic analysis
log_format waf_security '$remote_addr [$time_local] '
                        '$request_method $uri $server_protocol $status '
                        'THREAT=$threat_type ACTION=$action_desc '
                        'SQLi=$sql_injection_attempt XSS=$xss_attempt PT=$path_traversal '
                        'CI=$command_injection LFI=$lfi_attempt SCANNER=$scanner_signature BADUA=$suspicious_ua PROTO=$protocol_attack '
                        '"$http_user_agent" "$http_referer" REQ_ID=$request_id';

# Log suspicious requests to separate file for security team review
map $is_suspicious $log_to_waf {
    0 0;
    1 1;
}

# =============================================================================
# INTEGRATION NOTES
# =============================================================================


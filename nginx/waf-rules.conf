# =============================================================================
# L30 Library System - Web Application Firewall (WAF) Rules
# =============================================================================
# Nginx-based detection rules for common OWASP Top 10 attacks.
# Runs in DETECTION_ONLY mode (log, don't block) by default.
#
# Note: nginx map directives only inspect URL/headers — request body
# inspection requires application-layer validation (handled by FastAPI).
# =============================================================================

# WAF mode: detection-only. To enforce blocking, change default to "block"
# (nginx map can't read env vars directly — edit this value to switch modes)
map $uri $waf_action {
    default   "log";
}

# =============================================================================
# SQL INJECTION DETECTION (URL + query string only)
# =============================================================================
map $request_uri $sql_injection_attempt {
    default 0;
    ~*(?:union\s+select|select\s+.*\s+from|insert\s+into|update\s+.*\s+set|delete\s+from|drop\s+table|create\s+table)  1;
    ~*(?:or|and)\s+(?:1|true)\s*=                                                                                       1;
    ~*(?:union\s+all\s+select)                                                                                           1;
}

# =============================================================================
# CROSS-SITE SCRIPTING (XSS) DETECTION
# =============================================================================
map $request_uri $xss_attempt {
    default 0;
    ~*(?:<script|javascript:|onerror\s*=|onload\s*=|onclick\s*=|onmouseover\s*=)    1;
    ~*(?:<iframe|<object|<embed|<applet)                                              1;
}

# =============================================================================
# PATH TRAVERSAL DETECTION
# =============================================================================
map $request_uri $path_traversal {
    default 0;
    ~*(?:\.\./|\.\.%2[fF]|\.\.%5[cC])    1;
    ~*(?:%2[eE]%2[eE]/)          1;
}

# =============================================================================
# COMMAND INJECTION DETECTION
# =============================================================================
map $request_uri $command_injection {
    default 0;
    ~*(?:%7[cC]|%60|%24\()                                      1;
    ~*(?:(?:^|[&?])(?:cmd|exec|system|passthru|shell_exec)=)     1;
}

# =============================================================================
# LOCAL FILE INCLUSION (LFI) DETECTION
# =============================================================================
map $request_uri $lfi_attempt {
    default 0;
    ~*(?:file://|phar://|zip://|data://)                                1;
    ~*(?:/etc/passwd|/etc/shadow|/proc/self|/windows/system32)          1;
}

# =============================================================================
# VULNERABILITY SCANNER SIGNATURES
# =============================================================================
map $http_user_agent $scanner_signature {
    default 0;
    ~*(?:sqlmap|nikto|nmap|masscan|nessus|burp|zap|acunetix|netsparker|qualys|openvas|metasploit)   1;
    ~*(?:shodan|censys|zoomeye|fofa)                                                                 1;
}

# =============================================================================
# PROTOCOL ATTACK PATTERNS
# =============================================================================
map $request_uri $protocol_attack {
    default 0;
    ~*(?:%0[dD]%0[aA]|%0[aA]%0[dD])   1;
    ~*(?:%00)                            1;
}

# =============================================================================
# SUSPICIOUS USER AGENTS
# =============================================================================
map $http_user_agent $suspicious_ua {
    default 0;
    ""        1;
    "~^.{1,5}$" 1;
}

# =============================================================================
# FALSE POSITIVE EXCEPTIONS
# =============================================================================
map $request_uri $skip_waf_checks {
    default 0;
    ~*^/api/v1/search           1;
    ~*^/api/v1/webhooks/stripe  1;
    ~*^/api/v1/indie            1;
    ~*^/api/v1/marc-batch       1;
    ~*^/api/v1/catalog.*/images 1;
}

# =============================================================================
# COMPOSITE DETECTION — is this request suspicious?
# =============================================================================
map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt$scanner_signature$suspicious_ua$protocol_attack $is_waf_suspicious {
    "00000000" 0;
    default    1;
}

# =============================================================================
# ENFORCEMENT — high-confidence signals only (added 2026-07-05)
# =============================================================================
# Only strong, low-false-positive signals gate blocking: SQLi, XSS, path
# traversal, command injection, LFI, and known-scanner user agents. The fuzzy
# rules ($suspicious_ua = empty/short UA, $protocol_attack) are deliberately
# EXCLUDED here — they stay in $is_waf_suspicious for detection but never block,
# because empty-UA blocking 429s legitimate health checks and monitoring.
map $sql_injection_attempt$xss_attempt$path_traversal$command_injection$lfi_attempt$scanner_signature $is_waf_highconf {
    "000000" 0;
    default  1;
}

# Block only when a high-confidence signal fired AND the path is not exempt
# (skip_waf_checks covers search, stripe webhooks, indie, marc-batch, catalog
# images). $waf_block = "1" -> return 429 in the server block.
map $is_waf_highconf$skip_waf_checks $waf_block {
    default  0;
    "10"     1;
}

# =============================================================================
# WAF LOGGING
# =============================================================================
log_format waf_log '$remote_addr [$time_local] "$request" $status '
                   'SQL=$sql_injection_attempt XSS=$xss_attempt PT=$path_traversal '
                   'CI=$command_injection LFI=$lfi_attempt SCAN=$scanner_signature '
                   'UA=$suspicious_ua PROTO=$protocol_attack '
                   '"$http_user_agent"';

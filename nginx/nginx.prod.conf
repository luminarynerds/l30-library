worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    server_tokens off;

    # URI and body length limits -- return clean 413/414 instead of 502
    large_client_header_buffers 4 16k;
    client_header_buffer_size 4k;
    client_max_body_size 50m;

    # =============================================================================
    # WAF CONFIGURATION - Web Application Firewall Layer
    # =============================================================================
    # Operational modes controlled via WAF_MODE environment variable:
    #   - off     : No WAF rules applied
    #   - detect  : Log suspicious requests without blocking (DEFAULT, safe for rollout)
    #   - enforce : Log and block suspicious requests (429 status code)
    #
    # Initial deployment recommendation: DETECT mode for 2-4 weeks to identify
    # false positives before moving to ENFORCE mode for production blocking.
    # =============================================================================

    # Load WAF rule definitions and enforcement logic
    include /etc/nginx/waf-rules.conf;

    # Security headers
    # NOTE 2026-05-25: HSTS, X-Frame-Options, X-Content-Type-Options,
    # X-XSS-Protection, and Referrer-Policy are also set by Cloudflare in
    # front, producing duplicate response headers. Disabled here so CF is
    # the single source. CF's HSTS is the stronger 2yr + preload variant.
    # If CF is ever removed from in front of l30.org, re-enable these.
    # Permissions-Policy + CSP stay here because CF does not set them.
    # add_header X-Content-Type-Options "nosniff" always;
    # add_header X-Frame-Options "SAMEORIGIN" always;
    # add_header X-XSS-Protection "1; mode=block" always;
    # add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://static.cloudflareinsights.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: blob: https://cdn.jsdelivr.net https://fonts.gstatic.com; connect-src 'self' https://${DOMAIN} wss://${DOMAIN} https://static.cloudflareinsights.com https://*.ingest.us.sentry.io https://challenges.cloudflare.com; frame-src 'self' blob: https://challenges.cloudflare.com; child-src 'self' blob:; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # =============================================================================
    # LOGGING CONFIGURATION
    # =============================================================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript
               application/xml+rss application/atom+xml image/svg+xml;

    # Docker DNS resolver - re-resolve on container recreation
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;



    # SSL termination handled by host nginx - this container only serves HTTP on port 80
    # Host nginx proxies to this container on 127.0.0.1:8081

    # HTTP server - serves content when proxied via host nginx (X-Forwarded-Proto: https)

    # SEO: detect crawlers for dynamic meta tag injection
    map $http_user_agent $is_crawler {
        default                     0;
        ~*bot                       1;
        ~*crawl                     1;
        ~*spider                    1;
        ~*facebookexternalhit       1;
        ~*Twitterbot                1;
        ~*LinkedInBot               1;
        ~*Slackbot                  1;
        ~*WhatsApp                  1;
        ~*Discordbot                1;
        ~*TelegramBot               1;
    }

    # Route crawlers to backend SEO endpoint, normal users to frontend
    map $is_crawler $seo_upstream {
        default l30-frontend:80;
        1       l30-backend:8000;
    }

    # CORS origin allowlist
    map $http_origin $cors_origin {
        default "";
        "https://${DOMAIN}" $http_origin;
        "https://www.${DOMAIN}" $http_origin;
        "http://localhost:5173" $http_origin;
        "http://localhost:3000" $http_origin;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name ${DOMAIN} www.${DOMAIN};

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        proxy_intercept_errors on;


        # If request is already proxied through HTTPS-terminating reverse proxy (system nginx),
        # trust the X-Forwarded-Proto header and serve normally.
        # Otherwise, redirect to HTTPS.
        if ($http_x_forwarded_proto = "https") {
            # Already HTTPS-proxied, serve the content
            set $skip_redirect 1;
        }

        if ($skip_redirect != 1) {
            return 301 https://$host$request_uri;
        }

        # WAF enforcement — high-confidence attack signals only (SQLi, XSS, path
        # traversal, LFI, command injection, known-scanner UAs). Fuzzy rules
        # (empty/short UA, protocol) stay detect-only. Exempt paths (search,
        # stripe webhooks, indie, marc-batch, catalog images) are skipped via
        # $skip_waf_checks. See nginx/waf-rules.conf. Added 2026-07-05.
        access_log /var/log/nginx/waf-blocked.log waf_log if=$waf_block;
        if ($waf_block) {
            return 429;
        }

        # Serve requests that are already HTTPS-proxied
        # Health check
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # SSE stream for live AMA sessions — proxy buffering disabled
        location ~ ^/api/v1/amas/sessions/\d+/stream$ {
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }


        # /api/health is a real backend healthcheck (proxies to /health on
        # backend). Exact match — must come before the /api/ catchall so
        # nginx prefers it over the generic proxy.
        location = /api/health {
            access_log off;
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # API routes
        location /api/ {
            proxy_intercept_errors off;
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Retry on connection failures during backend restarts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
        }

        # Block API documentation in production
        location ~ ^/(docs|redoc|openapi\.json)$ {
            return 404;
        }

        # User-uploaded catalog images and files
        location /uploads/ {
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Alt frontend (static vanilla HTML/CSS/JS)

        # Cache hashed frontend assets (Vite produces /assets/[hash].js|css)
        location /assets/ {
            set $upstream_frontend http://l30-frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # User-uploaded and seeded media assets
        location /media/ {
            alias /usr/share/nginx/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Access-Control-Allow-Origin "https://${DOMAIN}";
        }

        # SEO: author profile pages — crawlers get meta from backend
        location ~ ^/indie/author/([^/]+)$ {
            set $seo_slug $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/indie/author/$seo_slug break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: ebook detail pages — crawlers get meta from backend
        location ~ ^/ebooks/(\d+)$ {
            set $seo_id $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/ebooks/$seo_id break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: indie book detail pages — crawlers get meta from backend
        location ~ ^/indie/book/([^/]+)$ {
            set $seo_slug $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/indie/book/$seo_slug break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: learn course detail pages — crawlers get meta from backend
        location ~ ^/learn/course/(\d+)$ {
            set $seo_id $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/learn/course/$seo_id break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: learn catalog page — crawlers get meta from backend
        location ~ ^/learn/catalog$ {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/learn/catalog break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: learn landing page — crawlers get meta from backend
        location ~ ^/learn$ {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/learn break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: learning-path detail pages — crawlers get meta from backend
        location ~ ^/learning-paths/(\d+)$ {
            set $seo_id $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/learning-paths/$seo_id break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: learning-paths list page — crawlers get meta from backend
        location ~ ^/learning-paths$ {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/learning-paths break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: board-meeting detail pages — crawlers get meta from backend
        location ~ ^/board/meetings/(\d+)$ {
            set $seo_id $1;
            proxy_intercept_errors off;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/board/meetings/$seo_id break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: events list — crawlers get per-event Event JSON-LD from backend
        location = /events {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/events break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: banned-books page — crawlers get mission text + stats SSR from backend
        # (backend route landed in #1868; this block is the missing nginx half of #951)
        location = /banned-books {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/banned-books break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: event detail pages — crawlers get meta + Event + BreadcrumbList JSON-LD
        location ~ ^/events/detail/(\d+)$ {
            set $seo_id $1;
            proxy_intercept_errors off;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/events/$seo_id break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: /discover landing — crawlers get per-route meta + LCP preload
        location = /discover {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/discover break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: blog tag-filtered list — MUST come before the /blog/{slug}
        # regex below; nginx evaluates regex locations in source order and
        # /blog/tag/{slug} would otherwise match /blog/([^/]+) first.
        location ~ ^/blog/tag/([^/]+)$ {
            set $seo_slug $1;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/blog/tag/$seo_slug break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: blog post detail — crawlers get per-post meta + BlogPosting JSON-LD
        location ~ ^/blog/([^/]+)$ {
            set $seo_slug $1;
            proxy_intercept_errors off;
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/blog/$seo_slug break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # SEO: blog landing — crawlers get the blog list shell + Blog JSON-LD
        location = /blog {
            if ($is_crawler) {
                rewrite ^ /api/v1/seo/blog break;
            }
            proxy_pass http://$seo_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        }

        # Block dotfile probes (.env, .git, .DS_Store, .htaccess, etc.)
        # /.well-known/ is intentionally allowed (falls through to location / proxy)
        location ~* ^/\.(env|git|DS_Store|htaccess|aws|ssh|svn|hg)(/|$) {
            return 404;
            access_log off;
        }

        # Frontend routes

        # Frontend routes
        location / {
            set $upstream_frontend http://l30-frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Development/localhost fallback server (catch-all for requests without Host match)
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        error_page 404 /404.html;
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        proxy_intercept_errors on;


        # Health check
        location /health {
            access_log off;
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # Block API documentation (security)
        location ~ ^/(docs|redoc|openapi.json) {
            return 404;
        }

        # SSE stream for live AMA sessions — proxy buffering disabled
        location ~ ^/api/v1/amas/sessions/\d+/stream$ {
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
            proxy_set_header Connection '';
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
            add_header X-Accel-Buffering no;
        }


        # /api/health is a real backend healthcheck (proxies to /health on
        # backend). Exact match — must come before the /api/ catchall so
        # nginx prefers it over the generic proxy.
        location = /api/health {
            access_log off;
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 10s;
        }

        # API routes
        location /api/ {
            proxy_intercept_errors off;
            # Handle CORS preflight requests (OPTIONS)
            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' $cors_origin always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, PATCH, DELETE, OPTIONS' always;
                add_header 'Access-Control-Allow-Headers' 'Authorization, Content-Type, Accept, Origin, X-Requested-With, X-Request-ID' always;
                add_header 'Access-Control-Max-Age' '600' always;
                return 204;
            }

            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Retry on connection failures during backend restarts
            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout http_502 http_503;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 15s;
        }

        # Frontend assets
        location /assets/ {
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
        }

        # User-uploaded catalog images and files
        location /uploads/ {
            set $upstream_backend http://l30-backend:8000;
            proxy_pass $upstream_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
        }

        # Alt frontend (static vanilla HTML/CSS/JS)

        # User-uploaded and seeded media assets
        location /media/ {
            alias /usr/share/nginx/media/;
            expires 30d;
            add_header Cache-Control "public, max-age=2592000";
            add_header Access-Control-Allow-Origin "https://${DOMAIN}";
        }

        # Frontend routes
        location / {
            set $upstream_frontend http://frontend:80;
            proxy_pass $upstream_frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto http;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }

    # Additional per-domain server blocks can be dropped into conf.d
    # to extend nginx with extra sites.
    include /etc/nginx/conf.d/*.conf;
}

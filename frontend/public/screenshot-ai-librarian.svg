<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#faf8f5;font-family:'DM Sans',sans-serif">
  <!-- Browser bar -->
  <rect width="800" height="50" fill="#2C241B"/>
  <circle cx="20" cy="25" r="6" fill="rgba(193,90,49,0.5)"/>
  <circle cx="36" cy="25" r="6" fill="rgba(196,162,101,0.5)"/>
  <circle cx="52" cy="25" r="6" fill="rgba(232,224,212,0.3)"/>
  <text x="70" y="32" font-size="11" fill="#888">l30.org/ask-librarian</text>

  <!-- Content area -->
  <rect x="0" y="50" width="800" height="550" fill="#faf8f5"/>

  <!-- Header -->
  <text x="40" y="90" font-size="20" font-weight="700" fill="#2C241B">✨ Ask a Librarian</text>
  <text x="40" y="110" font-size="11" fill="#999">AI assistant with full local control</text>

  <!-- Chat area (left) -->
  <rect x="40" y="130" width="450" height="350" fill="#fff" stroke="#e5e5e5" stroke-width="1" rx="6"/>

  <!-- Chat header -->
  <rect x="40" y="130" width="450" height="40" fill="linear-gradient(135deg,#8B7355,#a08c6e)" rx="6 6 0 0"/>
  <text x="55" y="155" font-size="11" font-weight="700" fill="#fff">Donna Fay - Recommendation Expert</text>

  <!-- Chat messages -->
  <rect x="55" y="185" width="360" height="35" fill="rgba(193,90,49,0.12)" rx="6"/>
  <text x="68" y="200" font-size="10" fill="#8B5A3A">Can you recommend a book for adults with ADHD?</text>

  <rect x="55" y="235" width="410" height="50" fill="#f5f3f0" rx="6"/>
  <text x="68" y="250" font-size="10" fill="#555" font-weight="500">I'd love to help! The Name of the Wind has a</text>
  <text x="68" y="264" font-size="10" fill="#555" font-weight="500">page-turning plot perfect for ADHD readers.</text>

  <!-- Input box -->
  <rect x="55" y="400" width="410" height="30" fill="#f0f0f0" stroke="#ddd" stroke-width="1" rx="4"/>
  <text x="68" y="420" font-size="10" fill="#bbb">Type your question...</text>

  <!-- Controls (right) -->
  <rect x="510" y="130" width="250" height="350" fill="#fff" stroke="#e5e5e5" stroke-width="1" rx="6"/>

  <!-- Controls header -->
  <text x="525" y="153" font-size="12" font-weight="700" fill="#333">⚙️ AI Controls</text>

  <!-- Control rows -->
  <g>
    <!-- Content Filter -->
    <rect x="525" y="173" width="220" height="35" fill="#f9f9f9" rx="3"/>
    <text x="540" y="188" font-size="10" font-weight="600" fill="#333">Content Filter</text>
    <text x="540" y="200" font-size="9" fill="#999">Block adult content</text>
    <rect x="735" y="180" width="25" height="14" fill="#22863a" rx="7"/>
    <circle cx="751" cy="187" r="4" fill="#fff"/>

    <!-- COPPA Compliance -->
    <rect x="525" y="220" width="220" height="35" fill="#f9f9f9" rx="3"/>
    <text x="540" y="235" font-size="10" font-weight="600" fill="#333">COPPA Compliance</text>
    <text x="540" y="247" font-size="9" fill="#999">Children protection mode</text>
    <rect x="735" y="227" width="25" height="14" fill="#22863a" rx="7"/>
    <circle cx="751" cy="234" r="4" fill="#fff"/>

    <!-- Local Model Only -->
    <rect x="525" y="267" width="220" height="35" fill="#f9f9f9" rx="3"/>
    <text x="540" y="282" font-size="10" font-weight="600" fill="#333">Local Model Only</text>
    <text x="540" y="294" font-size="9" fill="#999">No cloud APIs</text>
    <rect x="735" y="274" width="25" height="14" fill="#22863a" rx="7"/>
    <circle cx="751" cy="281" r="4" fill="#fff"/>

    <!-- Staff Override -->
    <rect x="525" y="314" width="220" height="35" fill="#f9f9f9" rx="3"/>
    <text x="540" y="329" font-size="10" font-weight="600" fill="#333">Staff Override</text>
    <text x="540" y="341" font-size="9" fill="#999">Allow manual responses</text>
    <rect x="735" y="321" width="25" height="14" fill="#22863a" rx="7"/>
    <circle cx="751" cy="328" r="4" fill="#fff"/>

    <!-- Status -->
    <rect x="525" y="365" width="220" height="50" fill="#f5f5f5" stroke="#e5e5e5" stroke-width="1" rx="3"/>
    <text x="540" y="377" font-size="9" font-weight="600" fill="#999">MODEL</text>
    <text x="540" y="391" font-size="10" fill="#333">Ollama (local)</text>
    <text x="540" y="405" font-size="9" fill="#22863a">● Running locally</text>
  </g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" style="background:#faf8f5;font-family:'DM Sans',sans-serif">
  <!-- Browser bar -->
  <rect width="800" height="50" fill="#2C241B"/>
  <circle cx="20" cy="25" r="6" fill="rgba(193,90,49,0.5)"/>
  <circle cx="36" cy="25" r="6" fill="rgba(196,162,101,0.5)"/>
  <circle cx="52" cy="25" r="6" fill="rgba(232,224,212,0.3)"/>
  <text x="70" y="32" font-size="12" fill="#888">l30.org/admin/features</text>

  <!-- Page header -->
  <text x="40" y="100" font-size="26" font-weight="600" fill="#2C241B">⚙️ Feature Toggles</text>
  <text x="40" y="125" font-size="13" fill="#999">Enable or disable features for your library</text>

  <!-- Feature rows -->
  <g>
    <!-- Row 1: Gamification -->
    <rect x="40" y="155" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="175" font-size="12" font-weight="600" fill="#333">🎮 Gamification</text>
    <text x="55" y="193" font-size="11" fill="#999">Points, badges, and achievement systems</text>
    <!-- Toggle ON -->
    <rect x="725" y="168" width="30" height="18" fill="#22863a" rx="9"/>
    <circle cx="748" cy="177" r="6" fill="#fff"/>

    <!-- Row 2: Reading Programs -->
    <rect x="40" y="215" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="235" font-size="12" font-weight="600" fill="#333">📚 Reading Programs</text>
    <text x="55" y="253" font-size="11" fill="#999">Summer reading, reading challenges, book clubs</text>
    <!-- Toggle ON -->
    <rect x="725" y="228" width="30" height="18" fill="#22863a" rx="9"/>
    <circle cx="748" cy="237" r="6" fill="#fff"/>

    <!-- Row 3: Board Features -->
    <rect x="40" y="275" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="295" font-size="12" font-weight="600" fill="#333">🗳️ Board Features</text>
    <text x="55" y="313" font-size="11" fill="#999">Board meetings, voting, documents, governance</text>
    <!-- Toggle ON -->
    <rect x="725" y="288" width="30" height="18" fill="#22863a" rx="9"/>
    <circle cx="748" cy="297" r="6" fill="#fff"/>

    <!-- Row 4: Advanced Analytics -->
    <rect x="40" y="335" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="355" font-size="12" font-weight="600" fill="#333">📊 Advanced Analytics</text>
    <text x="55" y="373" font-size="11" fill="#999">Detailed reporting, utilization metrics, trends</text>
    <!-- Toggle ON -->
    <rect x="725" y="348" width="30" height="18" fill="#22863a" rx="9"/>
    <circle cx="748" cy="357" r="6" fill="#fff"/>

    <!-- Row 5: Self-Checkout (OFF) -->
    <rect x="40" y="395" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="415" font-size="12" font-weight="600" fill="#333">🛒 Self-Checkout</text>
    <text x="55" y="433" font-size="11" fill="#999">Allow patrons to check out items independently</text>
    <!-- Toggle OFF -->
    <rect x="725" y="408" width="30" height="18" fill="#ddd" rx="9"/>
    <circle cx="732" cy="417" r="6" fill="#fff"/>

    <!-- Row 6: Makerspace -->
    <rect x="40" y="455" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="6"/>
    <text x="55" y="475" font-size="12" font-weight="600" fill="#333">🔧 Makerspace & Equipment</text>
    <text x="55" y="493" font-size="11" fill="#999">3D printers, VR equipment, recording studio</text>
    <!-- Toggle ON -->
    <rect x="725" y="468" width="30" height="18" fill="#22863a" rx="9"/>
    <circle cx="748" cy="477" r="6" fill="#fff"/>
  </g>
</svg>
  <!-- Votes list -->
  <text x="40" y="230" font-size="12" font-weight="600" fill="#333">Recent Votes</text>

  <!-- Vote row 1 -->
  <rect x="40" y="245" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="4"/>
  <text x="55" y="265" font-size="12" font-weight="600" fill="#333">2024-25 Operating Budget</text>
  <text x="55" y="281" font-size="10" fill="#999">Yes: 6 • Abstain: 2 • Result: PASS</text>

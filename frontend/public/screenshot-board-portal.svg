  <rect x="40" y="375" width="720" height="50" fill="#fff" stroke="#f0f0f0" stroke-width="1" rx="4"/>
  <text x="55" y="395" font-size="12" font-weight="600" fill="#333">Makerspace Equipment Budget - Year 2</text>
  <text x="55" y="411" font-size="10" fill="#999">Yes: 4 • Abstain: 2 • Pending: 3 • Voting Open</text>

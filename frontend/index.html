<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="L30 Library - Search the catalog, reserve a room, check your holds, find events." />
    <meta name="keywords" content="library, L30, community library, books, digital resources, events, ebooks" />
    <meta name="author" content="L30 Library" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://l30.org/" />
    <link rel="alternate" type="application/atom+xml" title="L30 Library Blog" href="/api/v1/blog/feed" />
    <link rel="alternate" type="text/calendar" title="L30 Board Meetings" href="/api/v1/board/meetings/calendar.ics" />
    <link rel="alternate" type="text/calendar" title="L30 Library Events" href="/api/v1/events/calendar.ics" />
    <link rel="alternate" type="application/rss+xml" title="L30 Board Meetings" href="/api/v1/board/meetings/feed.xml" />
    <!-- Pre-hydration placeholder only: usePageMeta replaces this with the
         tenant's library name from /branding as soon as the app mounts. -->
    <title>Library</title>

    <!-- Theme: dark by default (L30 identity), respect user choice -->
    <!-- Moved to external script to support strict CSP without unsafe-inline -->
    <script src="/theme-init.js"></script>

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme Color -->
    <meta name="theme-color" content="#FAFAF8" />
    <meta name="theme-color" content="#111111" media="(prefers-color-scheme: dark)" />

    <!-- iOS PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="L30" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180x180.png" sizes="180x180" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-167x167.png" sizes="167x167" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-152x152.png" sizes="152x152" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-120x120.png" sizes="120x120" />

    <!-- Windows/Microsoft Tiles -->
    <meta name="msapplication-TileColor" content="#FAFAF8" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <meta name="msapplication-config" content="/browserconfig.xml" />

    <!-- Mobile Web App Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="L30" />
    <meta name="format-detection" content="telephone=no" />

    <!-- Google Fonts: non-blocking load. preconnect + preload + async stylesheet (font-display:swap honored via URL param) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=IBM+Plex+Mono:wght@400;500&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap"></noscript>

    <!-- Preconnect to cover image hosts used by staff picks -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin>
    <link rel="dns-prefetch" href="https://images.unsplash.com">

    <!-- OpenGraph -->
    <meta property="og:site_name" content="L30 Library">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://l30.org/">
    <meta property="og:title" content="L30. A complete library system. Free, open-source, yours.">
    <meta property="og:description" content="Tour a full working demo library. The community is fictional. The software is real.">
    <meta property="og:image" content="https://l30.org/og-image.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="L30. A complete library system. Free, open-source, yours.">
    <meta name="twitter:description" content="Tour a full working demo library. The community is fictional. The software is real.">
    <meta name="twitter:image" content="https://l30.org/og-image.png">
    <!-- Structured data: Organization + WebSite (JSON-LD) for search engines / AI agents -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://l30.org/#organization",
          "name": "L30 Library",
          "url": "https://l30.org/",
          "logo": "https://l30.org/favicon.svg",
          "description": "L30 is a free, open-source library management system. This site is a live demo serving a fictional community."
        },
        {
          "@type": "WebSite",
          "@id": "https://l30.org/#website",
          "url": "https://l30.org/",
          "name": "L30 Library",
          "inLanguage": "en",
          "publisher": { "@id": "https://l30.org/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://l30.org/catalog?q={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
    </script>

    <!-- Umami analytics — self-hosted, first-party proxy to umami:3000 (cookieless, no PII) -->
    <script defer src="/script.js" data-website-id="aabbe343-b12d-41f5-9553-6ec48e1ce6db" data-host-url="/"></script>
  </head>
  <body>
    <div id="root">
      <!-- Inline skeleton: prevents blank-screen flicker while React loads (~300ms) -->
      <!-- React replaces this entire content on mount -->
      <style>
        .app-skeleton { min-height: 100vh; display: flex; flex-direction: column; }
        .dark .app-skeleton { background: #111111; color: #FAFAF8; }
        .light .app-skeleton { background: #FAFAF8; color: #1a1a1a; }
        .skel-header {
          height: 64px; border-bottom: 1px solid rgba(128,128,128,0.15);
          display: flex; align-items: center; padding: 0 24px; gap: 16px;
        }
        .skel-logo { width: 48px; height: 28px; border-radius: 4px; }
        .skel-nav { display: flex; gap: 24px; margin-left: auto; }
        .skel-nav-item { width: 60px; height: 12px; border-radius: 4px; }
        .skel-hero {
          max-width: 720px; margin: 80px auto 0; padding: 0 24px; text-align: center;
        }
        .skel-tagline { width: 140px; height: 10px; border-radius: 4px; margin: 0 auto 24px; }
        .skel-title { height: 48px; border-radius: 6px; margin: 0 auto 16px; max-width: 500px; }
        .skel-title-2 { height: 48px; border-radius: 6px; margin: 0 auto 32px; max-width: 400px; }
        .skel-search {
          height: 52px; border-radius: 12px; max-width: 560px; margin: 0 auto 32px;
          border: 1px solid rgba(128,128,128,0.2);
        }
        .skel-chips { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        .skel-chip { width: 100px; height: 36px; border-radius: 8px; }
        .dark .skel-pulse { background: rgba(255,255,255,0.06); }
        .light .skel-pulse { background: rgba(0,0,0,0.06); }
        @keyframes skel-shimmer {
          0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; }
        }
        .skel-pulse { animation: skel-shimmer 1.5s ease-in-out infinite; }
      </style>
      <div class="app-skeleton">
        <div class="skel-header">
          <div class="skel-logo skel-pulse"></div>
          <div class="skel-nav">
            <div class="skel-nav-item skel-pulse"></div>
            <div class="skel-nav-item skel-pulse"></div>
            <div class="skel-nav-item skel-pulse"></div>
          </div>
        </div>
        <div class="skel-hero">
          <div class="skel-tagline skel-pulse"></div>
          <div class="skel-title skel-pulse"></div>
          <div class="skel-title-2 skel-pulse"></div>
          <div class="skel-search skel-pulse"></div>
          <div class="skel-chips">
            <div class="skel-chip skel-pulse"></div>
            <div class="skel-chip skel-pulse"></div>
            <div class="skel-chip skel-pulse"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

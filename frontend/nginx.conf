server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression. `gzip_static on` serves pre-compressed .gz twins
    # emitted at build time (vite-plugin-compression2 + Dockerfile.prod);
    # the dynamic `gzip on` block remains as fallback for sub_filter-rewritten
    # HTML and any path without a static twin.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Brotli compression (~15-20% smaller than gzip; better mobile perf).
    # Module built from google/ngx_brotli in Dockerfile.prod build stage.
    # `brotli_static on` serves pre-compressed .br twins (quality 11) emitted
    # at build time; the dynamic `brotli on` block remains as fallback.
    brotli on;
    brotli_static on;
    brotli_comp_level 6;
    brotli_min_length 256;
    brotli_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Static assets: immutable caching, 404 on missing files (not SPA fallback)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|mp3|wav|mp4|webm)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SEO: inject page-specific meta tags via sub_filter for key routes
    # Crawlers and social media previews see correct titles without SSR
    sub_filter_once off;
    sub_filter_types text/html;

    location = /ebooks {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sub_filter '<title>L30 - Community Library</title>' '<title>Digital Library | L30 Community Library</title>';
        sub_filter 'og:title" content="L30 - Community Library"' 'og:title" content="Digital Library — Public Domain & Indie Ebooks"';
        sub_filter 'og:description" content="Search the catalog, reserve a room, check your holds, find events."' 'og:description" content="Browse 200+ ebooks. Public domain classics and indie originals. Borrow for free with your library card."';
        sub_filter 'twitter:title" content="L30 - Community Library"' 'twitter:title" content="Digital Library — Public Domain & Indie Ebooks"';
        sub_filter 'twitter:description" content="Search the catalog, reserve a room, check your holds, find events."' 'twitter:description" content="Browse 200+ ebooks. Public domain classics and indie originals. Borrow for free with your library card."';
        try_files /index.html =404;
    }

    location ~ ^/indie/author/register$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sub_filter '<title>L30 - Community Library</title>' '<title>Get Your Book Into Libraries | MetisLib</title>';
        sub_filter 'og:title" content="L30 - Community Library"' 'og:title" content="Libraries pay $10. You get $8. | MetisLib"';
        sub_filter 'og:description" content="Search the catalog, reserve a room, check your holds, find events."' 'og:description" content="94% royalty, no exclusivity. Get your indie ebook into real library catalogs."';
        sub_filter 'twitter:title" content="L30 - Community Library"' 'twitter:title" content="Libraries pay $10. You get $8. | MetisLib"';
        sub_filter 'twitter:description" content="Search the catalog, reserve a room, check your holds, find events."' 'twitter:description" content="94% royalty, no exclusivity. Get your indie ebook into real library catalogs."';
        try_files /index.html =404;
    }

    location = /indie {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sub_filter '<title>L30 - Community Library</title>' '<title>Indie Authors | L30 Community Library</title>';
        sub_filter 'og:title" content="L30 - Community Library"' 'og:title" content="Indie Authors — Discover Independent Voices"';
        sub_filter 'og:description" content="Search the catalog, reserve a room, check your holds, find events."' 'og:description" content="Support indie authors directly. Browse, borrow, and discover original ebooks from independent writers."';
        sub_filter 'twitter:title" content="L30 - Community Library"' 'twitter:title" content="Indie Authors — Discover Independent Voices"';
        sub_filter 'twitter:description" content="Search the catalog, reserve a room, check your holds, find events."' 'twitter:description" content="Support indie authors directly. Browse, borrow, and discover original ebooks from independent writers."';
        try_files /index.html =404;
    }

    location = /about {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        sub_filter '<title>L30 - Community Library</title>' '<title>About Us | L30 Community Library</title>';
        sub_filter 'og:title" content="L30 - Community Library"' 'og:title" content="About L30 — A Library That Owns Its Digital Future"';
        sub_filter 'og:description" content="Search the catalog, reserve a room, check your holds, find events."' 'og:description" content="We built our own tools, pay authors 94% royalty, and keep every dollar in the community."';
        sub_filter 'twitter:title" content="L30 - Community Library"' 'twitter:title" content="About L30 — A Library That Owns Its Digital Future"';
        sub_filter 'twitter:description" content="Search the catalog, reserve a room, check your holds, find events."' 'twitter:description" content="We built our own tools, pay authors 94% royalty, and keep every dollar in the community."';
        try_files /index.html =404;
    }

    # SPA fallback: serve index.html for all non-file routes, never cache it
    location / {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";

        try_files $uri $uri/ /index.html;
    }
}

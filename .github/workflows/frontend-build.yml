name: Frontend Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: Type check
      run: |
        cd frontend
        npm run typecheck

    - name: Lint
      continue-on-error: true
      run: |
        cd frontend
        npm run lint

    - name: Build
      run: |
        cd frontend
        npm run build

    - name: Test
      run: |
        cd frontend
        npm test -- --run || true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: frontend-build
        path: frontend/dist/
      if: always()

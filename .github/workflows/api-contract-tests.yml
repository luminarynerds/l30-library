name: API Contract Tests

on:
  workflow_dispatch:

jobs:
  snapshot-check:
    name: Verify schema snapshots are up-to-date
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -e ".[dev]"

    - name: Check snapshots are current
      run: |
        cd backend
        python scripts/generate_snapshots.py --check
      env:
        DATABASE_URL: sqlite+aiosqlite:////tmp/snapshot_check.db
        SECRET_KEY: ci-snapshot-check-key
        ENVIRONMENT: test

  contract-tests:
    name: Run contract tests
    runs-on: ubuntu-latest
    services:
      # Ephemeral CI-only database, created fresh each run and destroyed after workflow completes
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lsc
          POSTGRES_PASSWORD: test_password  # Ephemeral CI-only database, destroyed after workflow run
          POSTGRES_DB: lsc_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -e ".[dev]"

    - name: Initialize database schema
      env:
        DATABASE_URL: postgresql+asyncpg://lsc:test_password@localhost:5432/lsc_test
      run: |
        cd backend
        python scripts/init_db.py

    - name: Run contract tests
      env:
        DATABASE_URL: postgresql+asyncpg://lsc:test_password@localhost:5432/lsc_test
        TEST_DATABASE_URL: postgresql+asyncpg://lsc:test_password@localhost:5432/lsc_test
        REDIS_URL: redis://localhost:6379/0
        SECRET_KEY: test-secret-key-do-not-use
        ENVIRONMENT: test
      run: |
        cd backend
        python -m pytest tests/contract/ -v --no-header

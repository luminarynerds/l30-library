name: Journey Smoke Tests & Accessibility Regression

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journey-smoke-tests:
    name: Journey Smoke Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run journey smoke tests
        run: |
          cd frontend
          npm run test:e2e -- \
            --project=chromium \
            e2e/journey-*.spec.ts \
            --timeout=60000 \
            --max-failures=5
        timeout-minutes: 10

      - name: Run accessibility regression tests
        run: |
          cd frontend
          npm run test:e2e -- \
            --project=chromium \
            e2e/journey-accessibility-regression.spec.ts \
            --timeout=60000
        timeout-minutes: 5

      - name: Generate test report
        if: always()
        run: |
          cd frontend
          npx playwright show-report 2>/dev/null || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-tests-report
          path: frontend/playwright-report/
          retention-days: 30

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: journey-tests-results
          path: frontend/test-results/
          retention-days: 30

      - name: Comment PR with test results
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const resultsPath = 'frontend/playwright-report/results.json';

            if (fs.existsSync(resultsPath)) {
              const results = JSON.parse(fs.readFileSync(resultsPath, 'utf8'));
              const stats = results.stats || {};
              const testsPassed = stats.expected || 0;
              const testsFailed = stats.failed || 0;
              const duration = Math.round((stats.duration || 0) / 1000);

              const comment = `## Journey Smoke Tests Results\n\n- **Tests Passed:** ${testsPassed}\n- **Tests Failed:** ${testsFailed}\n- **Duration:** ${duration}s\n\n[View detailed report](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})`;

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: comment
              });
            }

  mobile-viewport-tests:
    name: Mobile Viewport Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        viewport:
          - "mobile-375px"
          - "mobile-390px"
          - "tablet-768px"
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run journey tests on viewport
        run: |
          cd frontend
          npm run test:e2e -- \
            --project=${{ matrix.viewport }} \
            e2e/journey-*.spec.ts \
            --timeout=60000
        timeout-minutes: 10

      - name: Upload results for viewport
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: viewport-tests-${{ matrix.viewport }}
          path: frontend/test-results/
          retention-days: 30

  performance-budget:
    name: Performance Budget Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright browsers
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Run performance tests
        run: |
          cd frontend
          cat > perf-test.spec.ts << 'EOFTEST'
          import { test, expect } from '@playwright/test'

          test.describe('Performance Budget', () => {
            const routes = [
              { path: '/', budget: 2500 },
              { path: '/catalog', budget: 3000 },
              { path: '/register', budget: 2000 },
              { path: '/account', budget: 3000 },
            ]

            for (const route of routes) {
              test(`${route.path} should load in ${route.budget}ms`, async ({ page }) => {
                const startTime = Date.now()
                await page.goto(route.path)
                await page.waitForLoadState('networkidle')
                const loadTime = Date.now() - startTime

                console.log(`${route.path} loaded in ${loadTime}ms (budget: ${route.budget}ms)`)
                expect(loadTime).toBeLessThan(route.budget)
              })
            }
          })
          EOFTEST

          npx playwright test perf-test.spec.ts --project=chromium
          rm perf-test.spec.ts

  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [journey-smoke-tests, mobile-viewport-tests, performance-budget]
    if: always()
    steps:
      - name: Check test results
        run: |
          echo "## Journey Tests Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test Suite | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Journey Smoke Tests | ${{ needs.journey-smoke-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Mobile Viewport Tests | ${{ needs.mobile-viewport-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Budget | ${{ needs.performance-budget.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Details" >> $GITHUB_STEP_SUMMARY
          echo "- **Tested Journeys:** Search→Hold, Register, Renewal, Account, Check-in" >> $GITHUB_STEP_SUMMARY
          echo "- **Mobile Viewports:** 375px, 390px, 768px" >> $GITHUB_STEP_SUMMARY
          echo "- **Accessibility:** WCAG 2.1 AA compliance, ARIA live regions, focus management" >> $GITHUB_STEP_SUMMARY
          echo "- **Performance Budget:** Catalog (<3s), Register (<2s), Account (<3s)" >> $GITHUB_STEP_SUMMARY

      - name: Fail if critical tests failed
        if: needs.journey-smoke-tests.result == 'failure'
        run: |
          echo "Journey smoke tests failed. Blocking merge."
          exit 1

  slack-notification:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: [journey-smoke-tests, mobile-viewport-tests, performance-budget]
    if: failure() && github.event_name == 'pull_request'
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Send Slack notification on failure
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v3.0.3
        with:
          webhook: ${{ env.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Journey Tests Failed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Journey Smoke Tests Failed* on PR #${{ github.event.pull_request.number }}\n\n*Branch:* ${{ github.event.pull_request.head.ref }}"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Failed Jobs:*\n- Journey Smoke Tests: ${{ needs.journey-smoke-tests.result }}\n- Mobile Tests: ${{ needs.mobile-viewport-tests.result }}\n- Performance: ${{ needs.performance-budget.result }}"
                  }
                },
                {
                  "type": "actions",
                  "elements": [
                    {
                      "type": "button",
                      "text": {
                        "type": "plain_text",
                        "text": "View Run"
                      },
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }

name: Secrets Scan

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  gitleaks:
    name: Gitleaks Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          history-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v3
        id: gitleaks
        with:
          verbose: true
          # Generate report for upload
          report-path: gitleaks-report.json
          redact: true
          fail: true

      - name: Upload Gitleaks Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          retention-days: 30

      - name: Comment on PR with results
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Security Alert:** Gitleaks detected potential secrets in this PR. Please review the scan report and remove any hardcoded credentials before proceeding.'
            })

  detect-secrets:
    name: Detect Secrets (detect-secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install detect-secrets
        run: pip install detect-secrets

      - name: Run detect-secrets scan
        id: secrets-scan
        continue-on-error: true
        run: |
          detect-secrets scan --all-files --force-use-all-plugins \
            --baseline .secrets.baseline \
            --log-timestamps 2>&1 | tee scan-output.txt

          # Check if any secrets were found
          if grep -q "WARNING" scan-output.txt; then
            echo "Secrets found. Generating detailed report..."
            detect-secrets scan --all-files --force-use-all-plugins --json > secrets-report.json
            exit 1
          fi

      - name: Upload detect-secrets Report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: detect-secrets-report
          path: secrets-report.json
          retention-days: 30

      - name: Comment on PR about secrets
        if: github.event_name == 'pull_request' && failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '**Security Warning:** The detect-secrets tool found potential credentials. Please review and remove any hardcoded secrets from your changes.'
            })

  trivy-fs-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'

  secret-patterns:
    name: Detect Common Secret Patterns
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan for secret patterns
        id: pattern-scan
        run: |
          set +e

          # Check for dangerous patterns
          PATTERNS=(
            "password\s*[:=]\s*['\"]"
            "api[_-]?key\s*[:=]"
            "secret\s*[:=]"
            "token\s*[:=]"
            "DATABASE_URL.*password"
            "REDIS_PASSWORD"
            "JWT_SECRET"
            "AWS_SECRET_ACCESS_KEY"
            "BEGIN RSA PRIVATE KEY"
            "BEGIN OPENSSH PRIVATE KEY"
            "\.env\.backup"
            "\.env\.prod"
            "\.env\.production"
          )

          FOUND=0

          for pattern in "${PATTERNS[@]}"; do
            matches=$(grep -r -E "$pattern" --include="*.py" --include="*.js" --include="*.ts" --include="*.sh" . 2>/dev/null || true)

            if [ ! -z "$matches" ]; then
              echo "Pattern detected: $pattern"
              echo "$matches"
              FOUND=1
            fi
          done

          if [ $FOUND -eq 1 ]; then
            echo "::error::Potential secrets detected in code"
            exit 1
          fi

        continue-on-error: true

      - name: Report pattern scan results
        if: failure()
        run: |
          echo "Secret pattern scan completed with warnings"
          echo "Review the output above for detected patterns"

  check-env-files:
    name: Check for committed .env files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify no .env files are committed
        run: |
          set +e

          # Check for .env files in git history and staging
          if git ls-files | grep -E '\.env(\.prod|\.production|\.backup)' > /dev/null; then
            echo "ERROR: .env files found in git repository"
            git ls-files | grep -E '\.env(\.prod|\.production|\.backup)'
            exit 1
          fi

          # Check git history
          if git log --all --name-only | grep -E '\.env(\.prod|\.production|\.backup)' > /dev/null; then
            echo "WARNING: .env files found in git history"
            echo "Run the remediation script to clean history: /opt/l30/scripts/clean_secrets_from_history.sh"
          fi

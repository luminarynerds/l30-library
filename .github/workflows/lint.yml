name: Lint & Type Check

on:
  workflow_dispatch:

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        cd backend
        pip install -e ".[dev]"
        pip install flake8 black isort mypy types-requests

    - name: Black format check
      continue-on-error: true
      run: |
        cd backend
        black --check app tests

    - name: isort import check
      continue-on-error: true
      run: |
        cd backend
        isort --check-only app tests

    - name: Flake8 lint
      run: |
        cd backend
        flake8 app --count --select=E9,F63,F7,F82 --show-source --statistics

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install dependencies
      run: |
        cd frontend
        npm ci

    - name: ESLint
      continue-on-error: true
      run: |
        cd frontend
        npm run lint

    - name: Type check
      run: |
        cd frontend
        npm run typecheck

  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Root artifact naming check
      run: ./scripts/check-root-artifacts.sh
